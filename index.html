<!DOCTYPE html>
<html>
<head>
    <title>Usability Testing Tool</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Usability Testing Survey</h1>

        <h3>Task Scenario</h3>
        <p>Imagine you are using an online shopping application.</p>

        <label>User Name:</label>
        <input type="text" id="username">

        <label>Task Completion (1-5):</label>
        <input type="number" id="task" min="1" max="5">

        <label>Ease of Use (1-5):</label>
        <input type="number" id="ease" min="1" max="5">

        <label>Overall Satisfaction (1-5):</label>
        <input type="number" id="satisfaction" min="1" max="5">

        <label>Feedback:</label>
        <textarea id="feedback"></textarea>

        <button onclick="submitSurvey()">Submit</button>

        <h2>Results</h2>
        <div id="results"></div>
    </div>

    <script src="script.js"></script>

</body>
</html>
